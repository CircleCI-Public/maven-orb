version: 2.1

orbs:
  # The orb we're building will be injected using the 'maven-orb' name.
  # (because config.yml's continue stage said "orb-name: maven-orb")
  orb-tools: circleci/orb-tools@12

filters: &filters
  tags:
    only: /.*/
executors:
  linux:
    machine:
      image: ubuntu-2404:current
  linux-edge:
    machine:
      image: ubuntu-2404:edge
  macos:
    macos:
      xcode: 26.4.1
  windows:
    machine:
      image: windows-server-2022-gui:current
      resource_class: windows.medium
      shell: bash.exe
  windows-edge:
    machine:
      image: windows-server-2022-gui:edge
      resource_class: windows.medium
      shell: bash.exe

commands:
  install-maven:
    steps:
      - run:
          name: Install Maven if the image does not have it
          command: |
            if command -v mvn >/dev/null 2>&1; then
              mvn -v
              exit 0
            fi
            case "$(uname -s)" in
              Darwin)
                brew install maven
                ;;
              MINGW*|MSYS*|CYGWIN*)
                choco install maven --version=3.9.10
                echo 'export PATH="$PATH:/c/ProgramData/chocolatey/lib/maven/apache-maven-3.9.10/bin/"' >> "$BASH_ENV"
                ;;
              Linux)
                sudo apt-get update
                sudo apt-get install -y maven
                ;;
            esac
  check-checksum-seed:
    parameters:
      checksum_location:
        type: string
      expected_poms:
        type: integer
        default: 1
    steps:
      - run:
          name: Check the cache checksum seed contains every pom.xml
          environment:
            SEED: << parameters.checksum_location >>
            EXPECTED: << parameters.expected_poms >>
          command: |
            case "$(uname -s)" in
              MINGW*|MSYS*|CYGWIN*)
                if [[ "$SEED" == /* ]]; then SEED="/c$SEED"; fi
                ;;
            esac
            FOUND="$(grep -c '<artifactId>my-app</artifactId>' "$SEED" || true)"
            echo "Found $FOUND pom.xml in $SEED, expected $EXPECTED"
            [ "$FOUND" = "$EXPECTED" ]

workflows:
  test-deploy:
    jobs:
      - maven-orb/test:
          filters: *filters
          name: test job with simple use case - <<matrix.executor>> - <<matrix.checksum_location>>
          app_src_directory: sample_app
          command: test -DforkCount=4
          matrix:
            alias: test job with simple use case
            parameters:
              executor: [maven-orb/default, linux, linux-edge, macos, windows, windows-edge]
              checksum_location: [/tmp/maven_cache_seed, ./.maven_cache_seed]
          pre-steps:
            - install-maven
          pre_mvn_steps:
            - check-checksum-seed:
                checksum_location: << matrix.checksum_location >>
      - maven-orb/test:
          filters: *filters
          name: Test test job with a root-owned directory in the workspace
          executor: linux
          app_src_directory: sample_app
          command: test
          skip_checkout: true
          pre-steps:
            - checkout
            - install-maven
            - run:
                name: Add a pom.xml the job user cannot read
                command: |
                  sudo mkdir -m 700 sample_app/root-only
                  sudo cp sample_app/pom.xml sample_app/root-only/pom.xml
          pre_mvn_steps:
            - check-checksum-seed:
                checksum_location: .maven_cache_seed
                expected_poms: 2
      - maven-orb/test:
          filters: *filters
          name: Test test job with multi-step use case
          app_src_directory: sample_app
          mvn_step_name: Show project.version, install, then test
          command: |
            help:evaluate -Dexpression=project.version -q -DforceStdout
            -Dmaven.test.skip=true install
            verify
          skip_checkout: true
          pre-steps:
            - checkout
            - run:
                name: Prevent git checkout from working again in this job
                command: rm -rf .git # any future checkout will fail
          pre_mvn_steps:
            - run:
                name: pre_mvn_step to show project.version
                command: |
                  cd sample_app
                  mvn help:evaluate -Dexpression=project.version -q -DforceStdout
          post_mvn_steps:
            - run:
                name: list files in the workspace
                command: find . -ls
      - maven-orb/test:
          filters: *filters
          name: Test test job with pom in base directory
          skip_checkout: true
          pre-steps:
            - checkout
            - run:
                name: Give us just the sample_app in the workspace
                command: |
                  set -ex
                  cd sample_app
                  tar -cf /tmp/sample_app.tar .
                  cd ..
                  rm -rf .[a-z]* *
                  tar -xf /tmp/sample_app.tar
                  rm /tmp/sample_app.tar
                  find . -ls
      - maven-orb/test:
          filters: *filters
          name: Test test job with test_results_path having an absolute path
          app_src_directory: sample_app
          command: test
          test_results_path: /tmp/custom-path-to-surefire-reports
          post_mvn_steps:
            - run:
                name: Move test results to custom path
                command: mv sample_app/target/surefire-reports /tmp/custom-path-to-surefire-reports
      - maven-orb/test:
          filters: *filters
          name: Test test job with test_results_path having a relative path
          app_src_directory: sample_app
          command: test
          test_results_path: custom-path-to-surefire-reports
          post_mvn_steps:
            - run:
                name: Move test results to custom path
                command: mv sample_app/target/surefire-reports sample_app/custom-path-to-surefire-reports
      - maven-orb/test:
          filters: *filters
          name: Test test job with custom executor
          app_src_directory: sample_app
          executor:
            name: maven-orb/default
            tag: '17.0-node'
            resource_class: medium
          pre-steps:
            - run:
                name: Verify we got the right executor - one with node installed
                command: node --version
      - maven-orb/parallel_test:
          filters: *filters
          name: Test parallel_test job with simple use case
          app_src_directory: sample_app
          command: test -DforkCount=4
      - maven-orb/parallel_test:
          filters: *filters
          name: Test parallel_test job with multi-step use case
          app_src_directory: sample_app
          mvn_step_name: Show project.version, install, then test
          command: |
            help:evaluate -Dexpression=project.version -q -DforceStdout
            -Dmaven.test.skip=true install
            verify
          skip_checkout: true
          pre-steps:
            - checkout
            - run:
                name: Prevent git checkout from working again in this job
                command: rm -rf .git # any future checkout will fail
          pre_mvn_steps:
            - run:
                name: pre_mvn_step to show project.version
                command: |
                  cd sample_app
                  mvn help:evaluate -Dexpression=project.version -q -DforceStdout
          post_mvn_steps:
            - run:
                name: list files in the workspace
                command: find . -ls
      - maven-orb/parallel_test:
          filters: *filters
          name: Test parallel_test job with pom in base directory
          skip_checkout: true
          pre-steps:
            - checkout
            - run:
                name: Give us just the sample_app in the workspace
                command: |
                  set -ex
                  cd sample_app
                  tar -cf /tmp/sample_app.tar .
                  cd ..
                  rm -rf .[a-z]* *
                  tar -xf /tmp/sample_app.tar
                  rm /tmp/sample_app.tar
                  find . -ls
      - orb-tools/pack:
          filters: *filters
          requires:
            - test job with simple use case
            - Test test job with a root-owned directory in the workspace
            - Test test job with multi-step use case
            - Test test job with pom in base directory
            - Test test job with test_results_path having an absolute path
            - Test test job with test_results_path having a relative path
            - Test test job with custom executor
            - Test parallel_test job with simple use case
            - Test parallel_test job with multi-step use case
            - Test parallel_test job with pom in base directory
          # Our GitHub repository is told to look for a job called "test" to
          # pass before a PR can be merged.
          # This job only runs if all the tests pass, we're going to call this
          # job "test" so that GitHub will know if this build is OK to merge.
          name: test
      - orb-tools/publish:
          orb_name: circleci/maven
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - test # actually the orb-tools/pack job
          context: orb-publisher
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
